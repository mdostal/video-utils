code_quality:
  linters: []
  formatters: []
  pre_commit:
    framework: null
    hooks: []
  code_snippets:
    - path: bin/review.py
      pattern: llm-judge-cli
      annotation: "Uploads video to the Gemini File API, polls until ACTIVE, then calls generateContent with a review prompt producing prose + a fenced clips.json block."
      lines: "1-40"
    - path: bin/clip.sh
      pattern: ffmpeg-cutter-cli
      annotation: "Reads clips.json (or a manual start/end range) and cuts shorts with ffmpeg into clips/<slug>/."
      lines: "1-40"
  test_first_signals:
    co_located_tests: false
    test_before_source: inconclusive
    test_runner_in_precommit: false
    bdd_keywords: false
    test_absence: true

project_maturity: early

north_star:
  goal: "Go from hitting stop on a recording to a published short with as little manual effort as possible — the plumbing between stop and post."
  audience: "Solo build-in-public creators — individual devs/creators running their own content pipeline who want composable CLI tools, not a platform."
  expected_scale: "Single local user — run locally by one person at a time, no concurrency concerns."
  pain_points: >
    Manual/slow pipeline stages (transcription, captions, reframing, publishing are still
    manual or missing per ROADMAP.md) and no CLI/automation polish (separate scripts instead
    of one entrypoint, no batch mode, no resumability, no tests). The operator also has limited
    video-editing experience and wants the tool to help start/guide/advise and do some of the
    initial manual cutting, cropping, rating, and idea generation so they can learn while
    editing/tweaking — with an eye toward eventually leveraging tools like Opus Clip and other
    automation so a fully automated suite lets them focus mostly on recording.
  success: "A faster stop-to-post pipeline — the time/effort from finishing a recording to having published shorts drops significantly."
