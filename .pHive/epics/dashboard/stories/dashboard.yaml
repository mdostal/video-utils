id: dashboard
epic: dashboard
title: "Add bin/dashboard.py: index + per-slug view + media serving"
status: done
complexity: high
methodology: classic
depends_on: []

description: |
  bin/dashboard.py [port] starts a local-only (127.0.0.1) HTTP server (stdlib
  http.server, no new dependency) with three routes:
  - GET /                    — index listing every slug under work/
  - GET /slug/<slug>         — detail page: thumbnail (if any), rendered
                               review.md (escaped, in a <pre>), clips.json's
                               suggestions listed, and links to files under
                               clips/<slug>/
  - GET /media/{work,clips}/<slug>/<file> — serves the actual file (so a
                               <video>/<img> tag or a download link works)

  Pre-made decisions:
  - No authentication, no HTTPS — this is a local dev convenience tool, not
    a deployed service; binding to 127.0.0.1 (never 0.0.0.0) is the entire
    security boundary and is non-negotiable.
  - Path-traversal guard: the media route resolves the requested path against
    its base dir (work/ or clips/) and rejects (404, not 500) anything that
    resolves outside that base — this is the one place user-controlled input
    reaches the filesystem, so it gets an explicit containment check, not
    just "trust the URL".
  - HTML is generated by plain string formatting with an `esc()` helper
    (stdlib-only, no templating engine) — matches this codebase's
    no-new-dependency posture throughout every prior epic.
  - Port: positional arg, else `VIDEO_DASHBOARD_PORT` env, else `8420`.
  - `review.md` is shown verbatim inside a `<pre>` (escaped) rather than
    rendered from Markdown — no Markdown-rendering dependency is introduced;
    called out explicitly as a v1 simplification, not silently done.
  - Server startup logs one line to stdout (`serving http://127.0.0.1:PORT/`)
    and otherwise stays quiet (`log_message` suppressed) so it composes
    cleanly with a test harness that starts/stops it as a background process.

  DO NOT:
  - Bind to any interface other than 127.0.0.1.
  - Add a web framework or templating dependency (Flask, Jinja2, etc.) —
    stdlib http.server is sufficient for this scope.
  - Implement editing/mutation routes (renaming clips, deleting reviews,
    etc.) — this is a read-only viewer, matching the ROADMAP ask ("a small
    local web view ... with the reviews and clip previews").

acceptance_criteria:
  - "Given work/<slug>/ exists with a review.md, when GET / is requested, then the response is 200 and contains a link to that slug."
  - "Given the same slug, when GET /slug/<slug> is requested, then the response is 200 and contains the review.md content and a list of files from clips/<slug>/ (if any)."
  - "Given a slug that does not exist under work/, when GET /slug/<bogus> is requested, then the response is 404 (not a 500 or a crash)."
  - "Given a real file under work/<slug>/ (e.g. thumbnail.jpg), when GET /media/work/<slug>/thumbnail.jpg is requested, then the response is 200 with the file's bytes and a sensible Content-Type."
  - "Given a path-traversal attempt (e.g. GET /media/work/<slug>/../../../../etc/passwd), when requested, then the response is 404, not the traversed file's contents."

steps:
  - id: research
    description: Confirm Python stdlib http.server's BaseHTTPRequestHandler/ThreadingHTTPServer API shape (do_GET, send_response/send_header/end_headers/wfile) and pathlib.Path.resolve()'s containment-check idiom for the traversal guard.
    agent: researcher
  - id: implement
    description: Write bin/dashboard.py with the three routes, the esc()/page() HTML helpers, and the safe_join() traversal guard.
    agent: developer
    depends_on: [research]
  - id: test
    description: Start the server as a background process against tests/smoke.sh's already-populated $TMP/work/demo (from earlier test blocks in the same run), curl all five acceptance criteria, then stop the server and confirm no leftover process.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm the traversal guard is airtight (test with both ../ and an absolute-path style request), and that the server never binds beyond 127.0.0.1.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to the feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: .
  tech_stack:
    languages: [python]
  key_files:
    - path: bin/review.py
      purpose: "Precedent for this codebase's plain-stdlib, no-framework Python style; dashboard.py follows the same posture with http.server instead of curl subprocess calls."

files_to_modify:
  - file: bin/dashboard.py
    change: "New file — the dashboard server."
  - file: bin/video
    change: "Add a `dashboard` subcommand."
  - file: .env.example
    change: "Document VIDEO_DASHBOARD_PORT."

code_examples:
  - title: "esc()/pathlib containment-check idiom this story introduces (no prior precedent in this codebase — first HTML/HTTP tool)"
    file: bin/review.py
    snippet: |
      # review.py's existing style: plain stdlib, subprocess-based, no
      # framework — dashboard.py's http.server usage follows the same
      # "no new dependency" posture for its own domain (serving HTTP).

design_decisions:
  - decision: "review.md is shown as escaped plain text in a <pre>, not rendered Markdown."
    rationale: "Avoids a Markdown-rendering dependency for a v1 read-only viewer; the raw text is still fully legible. A follow-up could add rendering later without changing the route structure."
  - decision: "The media route is a single generic handler parameterized by base dir (work/ vs clips/), not one route per file type."
    rationale: "Keeps the path-traversal guard in exactly one function (safe_join) rather than duplicated per route — a single, auditable security boundary."

cross_cutting:
  - concern: documentation
    action: "Add a 'Dashboard' section to docs/ARCHITECTURE.md and a row to README.md's tool table; document VIDEO_DASHBOARD_PORT in .env.example."
  - concern: honest-status
    action: "Flip ROADMAP.md's 'Dashboard' bullet to ✅ once all five acceptance criteria pass, noting review.md is shown as plain text (not rendered Markdown) as the one named v1 simplification."
  - concern: env-config-only
    action: "VIDEO_DASHBOARD_PORT added to .env.example; no hardcoded port in bin/dashboard.py."
  - concern: no-secrets-no-media-in-git
    action: "dashboard.py only reads existing work/clips output (already git-ignored) — it writes nothing new to disk, so no new .gitignore entries are needed."

risks:
  - severity: medium
    description: "A local HTTP server, even bound to 127.0.0.1, is new attack surface (path traversal, unbounded file reads) that nothing else in this codebase has had to consider."
    mitigation: "The path-traversal acceptance criterion (AC5) is treated as a hard requirement, not a nice-to-have, and the review step explicitly re-tests it with more than one traversal shape before this story is considered done."

references:
  - path: docs/ROADMAP.md
    relevant_excerpt: |
      🔲 **Dashboard** — a small local web view of `work/`/`clips/` with the reviews and clip previews.
