# From AGENTS.md / README.md (verbatim or summarized)
claude_md_summary: |
  video-utils is a small, open-source (MIT) library of composable CLI tools for a
  build-in-public video pipeline (pull → ingest → LLM-judge → clip). Not a content repo —
  no videos or personal data live here.

  Principles (hold these):
  - Unix philosophy: each tool does one thing, reads/writes plain files, exits non-zero on failure.
  - Config via env, never hardcode. No absolute paths, personal secret names, or usernames in
    committed code. Everything configurable comes from env vars documented in .env.example.
  - No secrets, no media in git. .gitignore blocks .env and all media.
  - Portable: macOS + Linux; depend only on common tools (bash, python3, curl, ffmpeg, optional gcloud).
  - Honest status: docs/ROADMAP.md marks what's built vs. intended. Don't claim a stub works.

  Adding a tool: put it in bin/, single responsibility, env-configured; document in README.md's
  table and docs/ARCHITECTURE.md; add new env vars to .env.example; keep the folder contract
  (raws → work/<slug>/ → clips/<slug>/ → ready/).

  Testing: no framework yet (roadmap item). For now, run each tool against a short sample clip
  and confirm expected output files + exit code 0. Don't commit the sample.

  docs/ROADMAP.md is written to be decomposed into an epic + stories — each bullet is a
  candidate feature.

tech_stack:
  languages: [bash, python]
  frameworks: []
  build_tools: []
  package_managers: []
  versions: {}

structure:
  modules:
    - name: bin
      purpose: "The CLI tools: loom-pull.sh, ingest.sh, review.py, clip.sh"
      source: bin/
    - name: docs
      purpose: "Architecture and roadmap documentation"
      source: docs/
  entry_points:
    - bin/loom-pull.sh
    - bin/ingest.sh
    - bin/review.py
    - bin/clip.sh

architecture:
  pattern: "Unix-pipeline: composable single-purpose scripts sharing a folder contract"
  di_framework: none
  state_management: "Filesystem-based (raws/, work/<slug>/, clips/<slug>/, ready/), no in-process state"
  navigation: n/a
  data_layer: "Plain files: meta.json (ffprobe output), clips.json (LLM-suggested clip ranges), review.md"

conventions:
  naming: "kebab-case script names in bin/; slug-based per-video working directories"
  file_organization: "bin/ for tools, docs/ for architecture/roadmap docs; stage outputs under work/<slug>/ and clips/<slug>/"
  branching: "single branch (master) so far — only one commit in history"
  commit_messages: "short imperative summary (e.g. 'Initial video-utils: pull, ingest, LLM-judge, clip')"

